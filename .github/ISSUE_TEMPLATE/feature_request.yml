name: Proponer una mejora / Feature request
description: Propón una función o mejora con un caso de uso claro, o sugiere una fuente nueva.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Las sugerencias de fuentes de México, Colombia, Argentina, Chile y Perú son especialmente bienvenidas.
        Este repositorio no mantiene adaptadores de recolección específicos para cada red social; consulta la [documentación de fuentes](https://github.com/PandiCloudDev/latido/blob/main/docs/sources.md) para conectar resultados de una recolección externa.
  - type: textarea
    id: problem
    attributes:
      label: Caso de uso y problema
      description: ¿Quién lo necesita y en qué situación? ¿Qué es incómodo hoy?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Mejora propuesta
      description: Describe el comportamiento o resultado que esperas; puedes incluir ejemplos concretos.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas que ya probaste (opcional)
      description: ¿Por qué la configuración actual, un script u otra solución no alcanzan?
