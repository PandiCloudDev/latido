name: Reportar un error / Bug report
description: Reporta una falla reproducible para ayudarnos a ubicarla y corregirla.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Las vulnerabilidades de seguridad se reportan por el [reporte privado de vulnerabilidades](https://github.com/PandiCloudDev/latido/security/advisories/new).
        No subas el .env completo, claves de API, contraseñas de administrador, cookies ni bases de datos de producción.
  - type: input
    id: revision
    attributes:
      label: Versión del código
      description: Ejecuta git rev-parse --short HEAD en el directorio del repositorio; si no estás seguro, indica la fecha de descarga o de la última actualización.
      placeholder: Commit, o fecha de descarga o actualización
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Entorno
      description: Sistema operativo, despliegue con Docker o local y versiones relevantes; si es un problema de la web, indica el navegador.
      placeholder: Ubuntu / macOS; Docker Compose / Node.js; ¿hay proxy inverso?; ¿cambiaste alguna configuración relacionada?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducirlo
      description: ¿Desde qué página, comando u operación empieza? Da los pasos mínimos que reproducen el problema.
      placeholder: |
        1. Abrir…
        2. Ejecutar…
        3. Aparece…
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Resultado esperado y resultado real
      placeholder: Esperaba…; en cambio…
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Registros o capturas (opcional)
      description: Pega solo los fragmentos relevantes y quita antes claves, contraseñas, cookies e información personal; también puedes enviarlo sin registros.
